name: OQTHERA security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt

      - name: Install gateway and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gateway/requirements.txt
          python -m pip install pip-audit bandit ruff

      - name: Compile Python sources
        run: python -m compileall -q gateway

      - name: Lint
        run: ruff check gateway

      - name: Static security analysis
        run: bandit -r gateway -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r gateway/requirements.txt

  secrets:
    name: Secret leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
